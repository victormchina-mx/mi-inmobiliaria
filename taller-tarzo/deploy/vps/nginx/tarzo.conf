# /etc/nginx/sites-available/tarzo.conf
server {
    listen 80;
    server_name tarzo.vmch.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tarzo.vmch.net;
    root /var/www/tarzo/current/public;
    index index.php;

    # Certbot completa estas dos líneas
    # ssl_certificate     /etc/letsencrypt/live/tarzo.vmch.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tarzo.vmch.net/privkey.pem;

    client_max_body_size 64M;   # videos de check-in
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Websockets de Laravel Reverb (tablero en tiempo real)
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~* \.(css|js|woff2?|svg|png|jpg|webp)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
