; /etc/supervisor/conf.d/tarzo-reverb.conf
[program:tarzo-reverb]
process_name=%(program_name)s
command=php /var/www/tarzo/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/tarzo/shared/storage/logs/reverb.log
minfds=10000
